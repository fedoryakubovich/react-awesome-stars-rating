name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run commitlint -- --from="$BASE_SHA" --to=HEAD
      - run: npm run typecheck
      - run: npm run test
      - run: npm run coverage
      - run: npm run build
      - run: npm run verify:package
      - run: npm run lint:package
      - run: npm run size
      - run: npm run build-storybook
      - run: npm run build:site

  release:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      # semantic-release opens an issue when a release fails; without this it
      # cannot, and masks the real error with a 403.
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      # npm authenticates this workflow through the package's trusted publisher
      # configuration. Do not add registry-url or NODE_AUTH_TOKEN here because
      # either would override OIDC with token authentication.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
