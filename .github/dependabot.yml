version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Dependabot defaults to "Bump x from a to b", which commitlint rejects for
    # having no type, so every update would fail CI and never auto-merge.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # Keep unsupported toolchain majors from repeatedly opening PRs that cannot
    # pass npm's peer-dependency resolution. Remove these entries when the
    # corresponding ESLint and TypeScript plugins add support.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
    # Every dependency here is a devDependency: react and react-dom are peers,
    # so nothing Dependabot bumps reaches consumers of the package.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - eslint-plugin-storybook
      linting:
        patterns:
          - eslint
          - eslint-*
          - '@typescript-eslint/*'
          - prettier
          - '@commitlint/*'
          - lint-staged
          - husky
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - playwright
          - '@playwright/*'
          - jsdom
          - axe-core
          - '@axe-core/*'
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - typescript
          - tailwindcss
          - '@tailwindcss/*'
          - rimraf
          - size-limit
          - '@size-limit/*'
      release:
        patterns:
          - semantic-release
          - '@semantic-release/*'
      forms:
        patterns:
          - formik
          - react-hook-form
          - '@tanstack/react-form'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
